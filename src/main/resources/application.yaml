server:
  forward-headers-strategy: framework
spring:
  config:
    import: "optional:aws-parameterstore:/config/myapp/"

  data:
    redis:
      cluster:
        nodes: ${spring.data.redis.host}:6379
      ssl:
        enabled: true
      timeout: 5s
      lettuce:
        extension:
          native-ssl: true

  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    hikari:
      connection-timeout: 30000
      maximum-pool-size: 10

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        dialect: org.hibernate.dialect.MySQL8Dialect

cloud:
  aws:
    sqs:
      enabled: true

app:
  aws:
    sqs:
      queue-name: PaymentQueue

ms2:
  url: http://payments-service:90

resilience4j:
  circuitbreaker:
    instances:
      ms2-service:
        sliding-window-size: 10
        failure-rate-threshold: 50
        wait-duration-in-open-state: 10s

  timelimiter:
    instances:
      ms2-service:
        timeout-duration: 5s

management:
  endpoints:
    web:
      exposure:
        include: health, prometheus
  endpoint:
    health:
      probes:
        enabled: true
      show-details: always
  metrics:
    tags:
      application: ms-estatisticas